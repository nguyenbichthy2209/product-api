name: Product API CD

on:
  workflow_run:
    workflows:
      - "Product API Production CI"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: product-api-production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/product-api:latest
  deploy-local:
    needs: build-and-push
    runs-on: [self-hosted, Windows, X64, product-api-local]
    timeout-minutes: 10

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Pull latest API image
        run: |
          docker compose -p product-api-prod -f docker-compose-prod.yaml pull product-api
          if ($LASTEXITCODE -ne 0) { throw "Pull failed" }

      - name: Deploy and check containers
        run: |
          docker compose -p product-api-prod -f docker-compose-prod.yaml up -d --wait --wait-timeout 180
          if ($LASTEXITCODE -ne 0) { throw "Deployment failed" }

      - name: Verify API health
        run: |
          $result = Invoke-RestMethod "http://localhost:3003/health" -TimeoutSec 15
          if ($result.status -ne "OK") { throw "Healthcheck failed" }
          $result | ConvertTo-Json
  