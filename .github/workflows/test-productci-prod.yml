name: Product API Production CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  integration-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://127.0.0.1:27017/productdb

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Start Product API
        run: |
          node app.js > app.log 2>&1 &
          echo $! > app.pid

      - name: Wait for API healthcheck
        run: |
          for i in {1..15}; do
            if curl --fail http://localhost:3000/health; then
              exit 0
            fi
            sleep 2
          done
          cat app.log
          exit 1

      - name: Test CREATE product
        run: |
          curl --fail -X POST http://localhost:3000/products \
          -H "Content-Type: application/json" \
          -d '{"pid":"P001","pname":"Laptop","price":15000000,"quantity":10}'

      - name: Test READ product
        run: |
          curl --fail http://localhost:3000/products/P001

      - name: Test UPDATE product
        run: |
          curl --fail -X PUT http://localhost:3000/products/P001 \
          -H "Content-Type: application/json" \
          -d '{"pname":"Laptop Dell","price":16000000,"quantity":8}'

      - name: Test DELETE product
        run: |
          curl --fail -X DELETE http://localhost:3000/products/P001